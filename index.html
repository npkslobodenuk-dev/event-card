<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вечер настолок</title>
  <style>
    body {
      margin: 24px;
      background: #EEF2F7;
      font-family: Arial, sans-serif;
      color: #172033;
    }
    .event-card {
      max-width: 560px;
      margin: 0 auto;
      background: #FFFFFF;
      border-radius: 16px;
      overflow: hidden;
    }
    .cover {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
    }
    .content { padding: 20px; }
    .button {
      display: inline-block;
      padding: 10px 16px;
      border-radius: 8px;
      background: #FACC15;
      color: #172033;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <article class="event-card">
    <img class="cover" src="board-games.png"
         alt="Игральные кости и фишки на игровом поле в фиолетовых тонах">
    <div class="content">
      <img src="event-icon.svg" width="48" height="48" alt="">
      <h1>Вечер настолок</h1>
      <p>Открытый турнир по классическим и новым настольным играм.</p>
      <a class="button" href="#details">Подробнее</a>
      <p id="details">Начало в 18:00. Встречаемся в главном зале антикафе.</p>
    </div>
  </article>
</body>
</html>
